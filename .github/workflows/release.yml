# Builds installers for Linux (AppImage, .deb, .rpm), Windows (NSIS .exe) and
# macOS (universal .dmg, Intel and Apple Silicon) and attaches them to a draft
# GitHub release when a tag like v0.3.0 is pushed, or when the workflow is run
# by hand (Actions → release → Run workflow: the version comes from
# tauri.conf.json and the tag is made when the draft is published). Publish
# the draft once all three are there. Each OS builds its own (no cross-compiling).
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Publishing a draft made by a manual run creates its tag, which would start
  # this workflow again: skip a tag whose release is already published.
  guard:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ] && gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft' 2>/dev/null | grep -q false; then
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

  # One job makes the draft (or finds the one this version already has) before
  # the three builds start: left to themselves they race and each may create
  # its own draft, splitting the installers across several releases.
  draft:
    needs: guard
    if: needs.guard.outputs.run == 'true'
    runs-on: ubuntu-latest
    outputs:
      id: ${{ steps.make.outputs.id }}
    steps:
      - uses: actions/checkout@v4
      - id: make
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then v="${GITHUB_REF_NAME#v}"; else v="$(node -p "require('./src-tauri/tauri.conf.json').version")"; fi
          # Release notes = this version's section of CHANGELOG.md (bullets only).
          body="$(awk -v v="$v" '
            /^## /{ on = ($2 == v) ; next }
            on && /^- / { print }
          ' CHANGELOG.md)"
          [ -n "$body" ] || body="- See the commit log"
          id="$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=50" --jq "[.[] | select(.tag_name == \"v$v\" and .draft)][0].id // empty")"
          if [ -z "$id" ]; then
            id="$(gh api "repos/$GITHUB_REPOSITORY/releases" -f tag_name="v$v" -f target_commitish="$GITHUB_SHA" -f name="se-ramify v$v" -f body="$body" -F draft=true --jq .id)"
          fi
          echo "id=$id" >> "$GITHUB_OUTPUT"

  build:
    needs: [guard, draft]
    if: needs.guard.outputs.run == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            bundles: appimage,deb,rpm
          - os: windows-latest
            bundles: nsis
          - os: macos-latest
            bundles: dmg
            target: universal-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux system deps (webkit2gtk etc.)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf build-essential curl wget file libssl-dev

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target == 'universal-apple-darwin' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
        with:
          releaseId: ${{ needs.draft.outputs.id }}
          args: --bundles ${{ matrix.bundles }}${{ matrix.target && format(' --target {0}', matrix.target) || '' }}
