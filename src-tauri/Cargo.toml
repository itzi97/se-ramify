[package]
name = "se-ramify"
version = "0.1.0"
description = "Local-first desktop app for the diagrams of a Software Engineering course."
edition = "2021"
license = "MIT"
rust-version = "1.77.2"

[lib]
name = "se_ramify_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["image-png"] }
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
tauri-plugin-store = "2"
# Copy a diagram as an image, or exported text, to the clipboard.
tauri-plugin-clipboard-manager = "2"
# Keeps the folder picked in the file dialog allowed across restarts.
tauri-plugin-persisted-scope = "2"
# Remembers window size (and position where the compositor allows it).
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures-util = "0.3"

[target.'cfg(target_os = "linux")'.dependencies]
# XDG settings portal: colour scheme + accent colour from GNOME / KDE.
ashpd = { version = "0.11", default-features = false, features = ["tokio"] }
tokio = { version = "1", features = ["macros"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
